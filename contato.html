
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Leva-e-Seca</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>🐶 Cachorro Leva-e-Seca</h1>
        <p>Estamos prontos para atender você!</p>

        <nav>
            <a href="index.html">Início</a>
            <a href="servicos.html">Serviços</a>
            <a href="precos.html">Preços</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main class="conteudo">
        <h2>Entre em Contato</h2>
        <p>Preencha o formulário para solicitar um horário.</p>

        <form class="formulario" action="#" method="get">
            <label for="nome">Nome do responsável:</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Digite seu nome" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone"
                   placeholder="(00) 00000-0000" required>

            <label for="pet">Nome do pet:</label>
            <input type="text" id="pet" name="pet"
                   placeholder="Nome do seu animal" required>

            <label for="servico">Serviço desejado:</label>
            <select id="servico" name="servico" required>
                <option value="">Selecione um serviço</option>
                <option value="banho">Banho</option>
                <option value="tosa">Tosa</option>
                <option value="escovacao">Escovação</option>
                <option value="banho-tosa">Banho + Tosa</option>
            </select>

            <label for="data">Data desejada:</label>
            <input type="date" id="data" name="data" required>

            <button class="botao" type="submit">
                Solicitar agendamento
            </button>
        </form>

        <p class="aviso">
            Este formulário é demonstrativo. O site não envia
            os dados para uma empresa.
        </p>
    </main>

    <footer>
        <p>&copy; 2026 Cachorro Leva-e-Seca</p>
    </footer>

</body>
</html>
